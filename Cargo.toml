[package]
name = "site"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.9", features = ["ws"] }
tokio = {version = "1", features = ["full"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
askama = "0.12"
askama_axum = "0.4"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15.7"
tower-http = { version = "0.5", features = ["fs", "trace"] }
anyhow = "1.0"
base64 = "0.23.1"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }
tower_governor = { version = "0.3", features = ["axum"] }
tracing-appender = "0.2.5"
# redis = { version = "0.24", features = ["tokio-comp"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
dashmap = "6.2.1"
futures-util = "0.3"
chrono = "0.4"
tokio-tungstenite = "0.24"
rand = "0.8"
time= "0.3"
include_dir = "0.7.4"
