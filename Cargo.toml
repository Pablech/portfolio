[package]
name = "site"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = {version = "1", features = ["full"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
askama = "0.12"
askama_axum = "0.4"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15.7"
tower-http = { version = "0.5", features = ["fs", "trace"] }
anyhow = "1.0"
base64 = "0.23.1"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }
tower_governor = { version = "0.3", features = ["axum"] }
tracing-appender = "0.2.5"
