<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="icon" type="image/png" href="/assets/favicon.svg">
</head>
<body class="theme-tty" onclick="document.getElementById('cmd-input').focus()">

    <div class="app-container">
        <div id="terminal" onclick="document.getElementById('cmd-input').focus()">
            <div id="output">
                <div class="cmd-output">Portfolio OS v1.0.0 (tty1)</div>
                <div class="cmd-output">Escreve 'help' para veres os comandos disponíveis.</div>
                <br>
            </div>
            
            <div class="input-line" id="input-container">
                <span class="prompt" id="prompt-label">pablech@portfolio:~\$</span>
                <span id="typed-text"></span>
                <span id="cursor-block"></span>
                <input type="text" id="cmd-input" autocomplete="off" autofocus spellcheck="false" style="position:absolute; opacity:0; width:1px;">
            </div>
        </div>

        <div id="resizer" style="display: none;"></div>

        <div id="side-panel" style="display: none;">
            <div class="side-header header-drag" id="header-side">
                <div class="side-tabs">
                    <span id="side-back-btn" style="display:none;" class="btn-tty">[VOLTAR]</span>
                    <span id="side-title">PAINEL LATERAL</span>
                </div>
                <div class="win-controls">
                    <span class="win-btn close-btn" onclick="closeSidePanel()">[X]</span>
                </div>
            </div>
            <div class="side-body" id="side-content">
            </div>
        </div>
    </div>

    <div id="modal-status" class="modal" style="display:none; border: 1px solid var(--tty-color); background: var(--bg-color); padding: 20px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; min-width: 320px; max-width: 500px; box-shadow: 0 0 15px rgba(0,255,0,0.2);">
        <div id="status-title" style="font-weight:bold; margin-bottom:12px; font-size: 1.1em;"></div>
        <div id="status-body" style="margin-bottom:20px; line-height: 1.4; word-break: break-word;"></div>
        <div style="text-align:right;">
            <span class="btn-tty" onclick="closeStatusModal()" style="cursor:pointer; padding: 4px 8px; border: 1px solid;">[ FECHAR ]</span>
        </div>
    </div>

    <script type="module" src="/assets/js/main.js?v={{ timestamp }}"></script>
</body>
</html>
